indexpage:
  title: Documentazione di NetApp Workload Factory
  summary: Inizia a usare NetApp Workload Factory per ottenere il massimo dai tuoi
    workload di cloud storage. Una volta completata la configurazione, potrai creare,
    ottimizzare e gestire i tuoi sistemi storage per i tuoi workload, esplorare i
    risparmi sui costi, usare il co-pilot Infrastructure-as-Code integrato per l'automazione
    su più piattaforme e gestire i tuoi workload in Workload Factory.
  keywords: Workload Factory, fsx, account, credentials, users, permissions, log in,
    calculator, codebox
  lead: Inizia a usare NetApp Workload Factory per ottenere il massimo dai tuoi workload
    quando usi Amazon FSx for NetApp ONTAP e OCI NetApp Storage Service. Una volta
    completata la configurazione, potrai creare, ottimizzare e gestire i file system
    FSx for ONTAP per i tuoi workload, scoprire il risparmio sui costi con FSx for
    ONTAP, usare il co-pilot Infrastructure-as-Code integrato per l'automazione tra
    piattaforme e gestire i tuoi workload in Workload Factory.
